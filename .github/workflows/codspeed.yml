name: codspeed

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  UV_NO_SYNC: "1"
  # Dump the Python stack if the benchmark process dies on a signal (it
  # currently exits 132/SIGILL on this runner with no traceback).
  PYTHONFAULTHANDLER: "1"

jobs:
  benchmarks:
    timeout-minutes: 30
    # CodSpeed-managed bare-metal ARM64 runner; required for walltime mode.
    runs-on: codspeed-macro
    permissions:
      contents: read  # For checkout
      id-token: write  # OIDC upload to CodSpeed
    steps:
      # Temporary diagnostics: the SIGILL below may be an ARMv8.2-compiled
      # wheel (torch et al.) on older or feature-asymmetric silicon — this
      # names the CPU and per-core features.
      - name: Show runner hardware
        run: |
          uname -a
          nproc
          cat /proc/cpuinfo
      - name: Checkout
        uses: actions/checkout@v7
      # After checkout (lfs: false) the archive is a ~130-byte LFS pointer;
      # hashFiles() of the pointer is a stable content-addressed key that
      # changes exactly when the recording changes (arch-independent asset).
      - name: Cache the replay dataset archive
        uses: actions/cache@v6
        with:
          path: data/.lfs/go2_hongkong_office.db.tar.gz
          key: lfs-go2-hongkong-office-${{ hashFiles('data/.lfs/go2_hongkong_office.db.tar.gz') }}
      # Self-healing whether or not the cache restored anything: pull only when
      # the file is still a pointer. Anonymous read from the .lfsconfig endpoint.
      - name: Fetch the replay dataset from LFS if not cached
        run: |
          if git lfs pointer --check --file data/.lfs/go2_hongkong_office.db.tar.gz; then
            git lfs pull --include="data/.lfs/go2_hongkong_office.db.tar.gz" --exclude=""
          else
            echo "archive restored from cache"
          fi
      # portaudio/turbojpeg mirror the tests job; libgl1/libglib2.0-0 (open3d)
      # and libgfortran5 (scipy) are preinstalled on GitHub-hosted images but
      # not necessarily on this runner.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libturbojpeg libgl1 libglib2.0-0 libgfortran5
      - name: Raise UDP receive buffers for LCM
        run: sudo sysctl -w net.core.rmem_max=67108864 net.core.rmem_default=67108864
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      # uv-managed (python-build-standalone) rather than setup-python: it
      # statically bundles a modern sqlite (>=3.45), which reading the replay
      # DB's JSONB tags requires; setup-python links the runner's libsqlite3.
      - name: Setup Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group tests --frozen
      - name: Pre-extract the replay database
        run: uv run python -c "from dimos.utils.data import get_data; print(get_data('go2_hongkong_office.db'))"
      # Temporary diagnostics: the plain (runner-less) smoke SIGILLed too, so a
      # native wheel dies on this silicon. Import each in a fresh interpreter;
      # the one that exits 132 is the culprit (the loop survives it).
      - name: Bisect native imports
        run: |
          for m in numpy scipy cv2 sqlite_vec lcm zenoh rerun open3d torch onnxruntime; do
            echo "=== import $m"
            uv run python -X faulthandler -c "import $m; print('$m ok')" || echo "=== $m FAILED with $?"
          done
      - name: Probe the sqlite read path
        run: uv run python -X faulthandler -c "import os; os.environ['DIMOS_BENCH_DURATION']='10'; from dimos.robot.unitree.go2.test_replay_benchmark import _expected_counts; print(_expected_counts('data/go2_hongkong_office.db'))"
      # If both probes pass, re-check the full path without the runner wrap.
      - name: Smoke the benchmark without the codspeed runner
        run: env DIMOS_BENCH_DURATION=10 uv run pytest --codspeed -m '' --no-cov dimos/robot/unitree/go2/test_replay_benchmark.py

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        env:
          # The benchmark process dies with SIGILL (exit 132) under the default
          # samply-based walltime profiler on this ARM64 runner; the same stack
          # runs clean on linux-aarch64 without it. Drop once samply behaves.
          CODSPEED_WALLTIME_PROFILER: perf
        with:
          mode: walltime
          run: uv run pytest --codspeed -m '' --no-cov dimos/robot/unitree/go2/test_replay_benchmark.py
