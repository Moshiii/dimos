name: docker-build-r1lite

# Development image for the Galaxea R1 Lite, built on the org's
# self-hosted runners and pushed with the workflow token, so no personal
# credential is involved. Manual dispatch only while the integration
# branch is in review; the schedule/main-path triggers stay with the
# production build ticket.

on:
  workflow_dispatch:
    inputs:
      dev-number:
        description: "N in the <version>-r1lite-dev.N tag"
        required: false
        default: "0"

jobs:
  build:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} || true

      - uses: actions/checkout@v7

      - name: Compute tag
        id: tag
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=ghcr.io/dimensionalos/dimos-r1lite:${VERSION}-r1lite-dev.${{ inputs.dev-number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # required for github cache of docker layers
      - uses: crazy-max/ghaction-github-runtime@v4

      # required for github cache of docker layers
      - uses: docker/setup-buildx-action@v4.2.0
        with:
          driver: docker-container
          use: true

      - uses: docker/build-push-action@v7.3.0
        with:
          push: true
          context: .
          file: docker/galaxea-r1lite/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/dimensionalOS/dimos
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=galaxea-r1lite
          cache-to: type=gha,mode=max,scope=galaxea-r1lite

      - name: Report digest
        run: |
          docker buildx imagetools inspect ${{ steps.tag.outputs.tag }} --format '{{ json .Manifest.Digest }}'
